<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tenable Football</title>
<style>
    body {
        background: #0f172a;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 30px;
    }
    table {
        margin: 20px auto;
        border-collapse: collapse;
        width: 60%;
    }
    th, td {
        border: 1px solid #334155;
        padding: 10px;
    }
    .filled {
        background: #14532d;
        font-weight: bold;
    }
</style>
</head>

<body>

<h1>⚽ Tenable: English Football</h1>

<select id="gameSelect"></select><br><br>

<input id="guessInput" placeholder="Type an answer">
<button onclick="submitGuess()">Submit</button>
<button onclick="resetCurrentGame()">Reset Progress</button>


<p id="message"></p>

<table id="gameTable"></table>

<!-- ✅ SCRIPT GOES AT THE BOTTOM -->
<script>
// ================== GAME DATA ==================
const games = {
    "Top 10 Premier League clubs by total points": [
        "Manchester United",
        "Arsenal",
        "Chelsea",
        "Liverpool",
        "Manchester City",
        "Tottenham Hotspur",
        "Everton",
        "Newcastle United",
        "West Ham United",
        "Aston Villa"
    ],

 "Top 10 Premier League clubs by most titles": [
        "Manchester United",
        "Liverpool",
        "Arsenal",
        "Chelsea",
        "Manchester City",
        "Blackburn Rovers",
        "Leicester City",
        "Everton",
        "Tottenham Hotspur",
        "Aston Villa"
    ],

"Top 10 Finishers in the Premier League 24/25 Season": [
        "Liverpool",
        "Arsenal",
        "Manchester City",
        "Chelsea",
        "Newcastle United",
        "Aston Villa",
        "Nottingham Forest",
        "Brighton",
        "Bournemouth",
        "Brentford"
    ]
};

// ================== STATE ==================
let currentGameTitle = "";
let currentGame = [];
let foundAnswers = [];

// ================== STORAGE ==================
function loadProgress(title) {
    return JSON.parse(localStorage.getItem("progress_" + title)) || [];
}

function saveProgress(title, answers) {
    localStorage.setItem("progress_" + title, JSON.stringify(answers));
}

function markCompleted(title) {
    localStorage.setItem("completed_" + title, "true");
}

function isCompleted(title) {
    return localStorage.getItem("completed_" + title) === "true";
}

// ================== INIT ==================
const gameSelect = document.getElementById("gameSelect");

function populateDropdown() {
    gameSelect.innerHTML = "";
    for (let title in games) {
        const option = document.createElement("option");
        option.value = title;
        option.textContent = isCompleted(title)
            ? title + " ✅ Completed"
            : title;
        gameSelect.appendChild(option);
    }
}

populateDropdown();
loadGame();
gameSelect.addEventListener("change", loadGame);

// ================== FUNCTIONS ==================
function loadGame() {
    currentGameTitle = gameSelect.value.replace(" ✅ Completed", "");
    currentGame = games[currentGameTitle];
    foundAnswers = loadProgress(currentGameTitle);
    document.getElementById("message").textContent = "";
    renderTable();
}

function renderTable() {
    const table = document.getElementById("gameTable");
    table.innerHTML = "<tr><th>Position</th><th>Answer</th></tr>";

    currentGame.forEach((answer, index) => {
        const row = document.createElement("tr");
        const pos = document.createElement("td");
        const ans = document.createElement("td");

        pos.textContent = index + 1;
        ans.textContent = foundAnswers.includes(answer) ? answer : "—";

        if (foundAnswers.includes(answer)) row.classList.add("filled");

        row.appendChild(pos);
        row.appendChild(ans);
        table.appendChild(row);
    });
}

function submitGuess() {
    const input = document.getElementById("guessInput");
    const guess = input.value.trim().toLowerCase();
    input.value = "";

    if (!guess) return;

    const match = currentGame.find(a => a.toLowerCase() === guess);

    if (match) {
        if (!foundAnswers.includes(match)) {
            foundAnswers.push(match);
            saveProgress(currentGameTitle, foundAnswers);

            if (foundAnswers.length === currentGame.length) {
                markCompleted(currentGameTitle);
                populateDropdown();
                document.getElementById("message").textContent =
                    "🏆 GAME COMPLETED!";
            } else {
                document.getElementById("message").textContent =
                    `✅ Correct: ${match}`;
            }
        } else {
            document.getElementById("message").textContent =
                "😐 Already got that one.";
        }
    } else {
        document.getElementById("message").textContent =
            "❌ Not in the top 10.";
    }

    renderTable();
}
function resetCurrentGame() {
    if (!currentGameTitle) return;

    // Remove saved data for this game
    localStorage.removeItem("progress_" + currentGameTitle);
    localStorage.removeItem("completed_" + currentGameTitle);

    // Reset state
    foundAnswers = [];
    document.getElementById("message").textContent =
        "🔄 Progress reset. Have another go.";

    // Update UI
    populateDropdown();
    renderTable();
}

</script>

</body>
</html>
